<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Waybill Table Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Waybill Table Generator</h2>

    <div class="section">
        <label style="margin-bottom:8px;color:#00c853">Table Title:</label>
        <input type="text" id="tableTitle" placeholder="NACHOL, SERCHOL, etc">
    </div>

    <div class="section">
        <div class="checks" id="checks"></div>
    </div>

    <div class="section">
        <div class="paste-wrap">
            <button id="pasteBtn" type="button">Click to paste copied text here</button>
        </div>
        <textarea id="txt" placeholder="Paste waybill data here..."></textarea>
    </div>

    <div class="section">
        <div class="buttons">
            <button id="parseBtn">Build Table</button>
            <button id="csvBtn">CSV</button>
            <button id="pdfBtn">PDF</button>
            <button id="imgBtn">Image</button>
        </div>

        <div class="tableWrap">
            <div id="exportArea">
                <div id="exportTitle"></div>
                <table id="table"></table>
            </div>
        </div>
    </div>
    <script src="bill craft.js"></script>
</body>

</html>
